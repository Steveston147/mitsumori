name: 見積アプリ自動確認

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存パッケージを固定状態でインストール
        run: npm ci

      - name: 自動テスト
        run: npm test

      - name: ビルド確認
        run: npm run build
